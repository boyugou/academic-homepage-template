# Builds the Astro site and deploys it to GitHub Pages.
#
# Runs on every push to main, on the 1st of each month (so build-time data
# such as Hugging Face download counts stays current without a code change),
# and on demand from the Actions tab.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
